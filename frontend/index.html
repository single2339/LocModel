<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocModel</title>
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="i18n.js"></script>
</head>
<body>
<div id="app">
  <script>try{if(localStorage.getItem("sideCollapsed")==="true")document.getElementById("app").classList.add("collapsed")}catch(e){}</script>
  <aside class="side">
    <div>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i class="c-gpu"></i><i class="c-ram"></i><i class="c-disk"></i></div>
        <span class="brand-name">LocModel</span>
      </div>
      <nav class="nav" aria-label="主导航">
        <button data-act="go" data-page="overview" id="nav-overview" title="概览">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span class="lbl">概览</span></button>
        <button data-act="go" data-page="models" id="nav-models" title="模型">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span class="lbl">模型</span></button>
        <button data-act="go" data-page="run" id="nav-run" title="运行">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l13 8-13 8V4z"/></svg><span class="lbl">运行</span><i class="dot hidden" id="run-dot"></i></button>
        <button data-act="go" data-page="chat" id="nav-chat" title="对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="lbl">对话</span></button>
        <button data-act="go" data-page="agent" id="nav-agent" title="Agent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4M9 12h.01M15 12h.01M9 16h6M2 12v2M22 12v2"/></svg><span class="lbl">Agent</span></button>
        <button data-act="go" data-page="image" id="nav-image" title="画图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span class="lbl">画图</span></button>
        <button data-act="go" data-page="video" id="nav-video" title="视频">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span class="lbl">视频</span></button>
        <button data-act="go" data-page="monitor" id="nav-monitor" title="监测">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span class="lbl">监测</span></button>
        <button data-act="go" data-page="settings" id="nav-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="lbl">设置</span></button>
      </nav>
    </div>
    <div class="side-foot">
    <button class="side-toggle upd-side" id="updSide" data-act="openUpdate" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbl">有新版本</span><i class="upd-dot" aria-hidden="true"></i>
    </button>
    <button class="side-toggle" id="fsToggle" data-act="toggleFullscreen" title="全屏（F11）" aria-label="全屏（F11）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/></svg><span class="lbl">全屏</span>
    </button>
    <button class="side-toggle" id="sideToggle" data-act="toggleSide" title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M15 10l-2 2 2 2"/></svg><span class="lbl">收起</span>
    </button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="dropmask" aria-hidden="true"><div>松开鼠标，把文件发给模型</div></div>
<script src="markdown.js"></script>
<script src="highlight.js"></script>
<script src="app.js"></script>
<script src="agent.js"></script>
<script src="chatmgr.js"></script>
<script src="monitor.js"></script>
<script src="apis.js"></script>
<script src="updater.js"></script>
<script src="imagegen.js"></script>
<script src="canvas.js"></script>
<script src="agentpage.js"></script>
</body>
</html>
