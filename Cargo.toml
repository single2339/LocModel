[package]
name = "locmodel"
version = "3.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"
sysinfo = "0.37"
rfd = "0.15"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
tempfile = "3"
open = "5"
base64 = "0.22"
scraper = "0.24"
calamine = "0.31"
zip = {version="4",default-features=false,features= ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.10"
enigo = "0.3"
screenshots = "0.8"
tokio = {version="1",features= ["sync", "macros"] }
shell-words = "1"
flate2 = "1"
tar = "0.4"
auto-launch = "0.5"
qrcode = {version="0.14", default-features=false, features= ["svg"] }

[[test]]
name = "desktop"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = {version="0.2.2",default-features=false,features= ["MTLDevice", "std"] }
objc2 = "0.5"
plist = "1"

[dev-dependencies]
tiny_http = "0.12"
